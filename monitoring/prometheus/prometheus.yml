global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "restaurant-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: "order-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
